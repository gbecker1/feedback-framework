<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Feedback</title>
<script>try{var t=localStorage.getItem('feedback-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="preview-banner" id="previewBanner">
  ⚠️ Local preview mode — answers are saved only in this browser (Firebase not configured yet).
</div>

<div class="wrap">

  <!-- Item picker (shown when no ?uc= is given) -->
  <div class="picker" id="picker" style="display:none">
    <h2 id="pickerTitle">Give feedback</h2>
    <p class="sub" id="pickerSub">Pick the item you want to rate.</p>
    <div class="pick-list" id="pickList"></div>
  </div>

  <!-- Feedback form -->
  <div id="formWrap" style="display:none">
    <div class="uc-head">
      <div class="uc-eyebrow">
        <span class="uc-num" id="ucNum"></span>
        <span class="uc-chip" id="ucChip"></span>
      </div>
      <h1 id="ucTitle"></h1>
      <p id="ucLead"></p>
      <img id="ucShot" alt="" style="display:none;width:100%;border-radius:12px;margin:14px 0 4px;border:1px solid var(--line);cursor:zoom-in" />
    </div>

    <form class="form" id="form"></form>

    <!-- Thank-you -->
    <div class="thanks" id="thanks">
      <div class="big">🙌</div>
      <h2 id="thanksTitle">Thanks!</h2>
      <p id="thanksMsg"></p>
      <div class="actions">
        <a class="primary" id="againBtn" href="index.html">Rate another item</a>
        <button type="button" id="editBtn">Change my answer</button>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import cfg from "./js/config.js";
  import { ITEMS, getItem, stripPrefix, categoryOf } from "./js/items.js";
  import { saveResponse, getMyResponse, isConfigured } from "./js/db.js";
  import { initChrome } from "./js/theme.js";

  initChrome({ home: "index.html" });

  if (!isConfigured) document.getElementById('previewBanner').classList.add('show');

  const Q = cfg.questions;
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const params = new URLSearchParams(location.search);
  const uc = getItem(params.get('uc'));

  if (!uc) {
    // ---------- No/invalid ?uc= → show the picker ----------
    document.getElementById('picker').style.display = 'block';
    document.getElementById('pickerTitle').textContent = Q.copy.pickerTitle;
    document.getElementById('pickerSub').textContent = Q.copy.pickerSub;
    document.getElementById('pickList').innerHTML = ITEMS.map(u => {
      const t = categoryOf(u);
      return `<a class="pick" href="feedback.html?uc=${encodeURIComponent(u.id)}" style="--pa:${t.solid};--pg:${t.grad}">
        <span class="pn">${esc(stripPrefix(u.id))}</span>
        <span class="pt"><h3>${esc(u.title)}</h3><span>${esc(t.label)}${u.tag ? ' · ' + esc(u.tag) : ''}</span></span>
      </a>`;
    }).join('');
  } else {
    // ---------- Render the form for this item ----------
    const t = categoryOf(uc);
    document.documentElement.style.setProperty('--acc', t.solid);
    document.documentElement.style.setProperty('--acc-grad', t.grad);
    document.getElementById('formWrap').style.display = 'block';
    document.getElementById('ucNum').textContent = uc.id;
    document.getElementById('ucChip').textContent = t.label;
    document.getElementById('ucTitle').textContent = uc.title;
    document.getElementById('ucLead').textContent = uc.lead || '';
    const shot = document.getElementById('ucShot');
    if (uc.image) { shot.src = uc.image; shot.alt = uc.title; shot.style.display = 'block'; shot.onclick = () => window.open(uc.image, '_blank'); }
    document.getElementById('thanksTitle').textContent = Q.copy.thanksTitle;
    document.getElementById('againBtn').textContent = Q.copy.rateAnother;
    document.getElementById('editBtn').textContent = Q.copy.changeAnswer;
    document.title = `${uc.id} · ${cfg.brand.titleSuffix}`;

    // --- build the form from config ---
    const scaleHtml = Q.scales.map(s => `
      <div class="section">
        <div class="q">${esc(s.label)} ${s.required ? '<span class="req">*</span>' : ''}</div>
        ${s.hint ? `<div class="hint">${s.hint}</div>` : ''}
        <div class="scale" data-scale="${s.key}" role="radiogroup" aria-label="${esc(s.label)}">
          ${Array.from({ length: Q.scaleMax }, (_, i) => `<button type="button" value="${i + 1}">${i + 1}</button>`).join('')}
        </div>
        ${s.ends ? `<div class="scale-ends"><span>${esc(s.ends[0])}</span><span>${esc(s.ends[1])}</span></div>` : ''}
      </div>`).join('');
    const chipHtml = Q.chipGroups.map(g => `
      <div class="section">
        <div class="q">${esc(g.heading)}</div>
        ${g.hint ? `<div class="hint">${esc(g.hint)}</div>` : ''}
        <div class="chips" data-chips="${g.key}"></div>
        <div class="add-row">
          <input type="text" data-add="${g.key}" placeholder="${esc(g.addPlaceholder || 'Add your own…')}" />
          <button type="button" class="btn-add" data-addbtn="${g.key}">+ Add</button>
        </div>
      </div>`).join('');
    document.getElementById('form').innerHTML = scaleHtml + chipHtml + `
      <div class="submit-bar">
        <button type="submit" class="btn-submit" id="submitBtn" disabled>${esc(Q.copy.submit)}</button>
        <div class="note"><span class="anon">${Q.copy.anonNote}</span> ${Q.copy.anonTail}</div>
      </div>`;

    const CHIP_SETS = {};
    Q.chipGroups.forEach(g => { CHIP_SETS[g.key] = g.options || []; });
    const requiredScales = Q.scales.filter(s => s.required).map(s => s.key);

    // --- selection state ---
    const state = {};
    Q.scales.forEach(s => state[s.key] = null);
    Q.chipGroups.forEach(g => state[g.key] = new Set());

    const submitBtn = document.getElementById('submitBtn');
    function refreshSubmit() { submitBtn.disabled = !requiredScales.every(k => state[k]); }

    function addChip(field, label, { custom = false, selected = true } = {}) {
      const val = String(label).trim();
      if (!val) return;
      const host = document.querySelector(`.chips[data-chips="${field}"]`);
      const existing = [...host.querySelectorAll('.chip')].find(c => c.dataset.val.toLowerCase() === val.toLowerCase());
      if (existing) { if (selected) { existing.classList.add('sel'); state[field].add(existing.dataset.val); } return; }
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (selected ? ' sel' : '') + (custom ? ' custom' : '');
      chip.dataset.val = val;
      chip.innerHTML = esc(val) + (custom ? ' <span class="x" aria-label="remove">×</span>' : '');
      host.appendChild(chip);
      if (selected) state[field].add(val);
    }

    for (const key of Object.keys(CHIP_SETS)) {
      CHIP_SETS[key].forEach(label => addChip(key, label, { custom: false, selected: false }));
    }

    document.querySelectorAll('.scale').forEach(scale => {
      const field = scale.dataset.scale;
      scale.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          scale.querySelectorAll('button').forEach(b => b.classList.remove('sel'));
          btn.classList.add('sel');
          state[field] = parseInt(btn.value, 10);
          refreshSubmit();
        });
      });
    });

    document.querySelectorAll('.chips').forEach(group => {
      const field = group.dataset.chips;
      group.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        const v = chip.dataset.val;
        if (e.target.classList.contains('x')) { state[field].delete(v); chip.remove(); return; }
        if (state[field].has(v)) { state[field].delete(v); chip.classList.remove('sel'); }
        else { state[field].add(v); chip.classList.add('sel'); }
      });
    });

    function commitAdd(field) {
      const inp = document.querySelector(`input[data-add="${field}"]`);
      const raw = (inp.value || '').trim();
      if (!raw) return;
      raw.split(',').map(s => s.trim()).filter(Boolean).forEach(s => addChip(field, s, { custom: true, selected: true }));
      inp.value = '';
      inp.focus();
    }
    document.querySelectorAll('input[data-add]').forEach(inp => {
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commitAdd(inp.dataset.add); } });
    });
    document.querySelectorAll('.btn-add').forEach(btn => {
      btn.addEventListener('click', () => commitAdd(btn.dataset.addbtn));
    });

    // pre-fill if this browser already answered this item
    getMyResponse(uc.id).then(prev => {
      if (!prev) return;
      Q.scales.forEach(s => {
        if (prev[s.key]) { const b = document.querySelector(`.scale[data-scale="${s.key}"] button[value="${prev[s.key]}"]`); if (b) b.click(); }
      });
      Q.chipGroups.forEach(g => {
        (prev[g.key] || []).forEach(val => {
          const known = (CHIP_SETS[g.key] || []).some(l => l.toLowerCase() === String(val).toLowerCase());
          addChip(g.key, val, { custom: !known, selected: true });
        });
      });
    }).catch(() => {});

    function collect(key) { commitAdd(key); return [...state[key]]; }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!requiredScales.every(k => state[k])) return;
      submitBtn.disabled = true; submitBtn.textContent = Q.copy.sending;
      const response = {};
      Q.scales.forEach(s => response[s.key] = state[s.key]);
      Q.chipGroups.forEach(g => response[g.key] = collect(g.key));
      try {
        const mode = await saveResponse(uc.id, response);
        document.getElementById('thanksMsg').textContent = mode === 'local' ? Q.copy.thanksLocal : Q.copy.thanksLive;
        document.getElementById('form').classList.add('hide');
        document.getElementById('thanks').classList.add('show');
        window.scrollTo(0, 0);
      } catch (err) {
        submitBtn.disabled = false; submitBtn.textContent = Q.copy.submit;
        alert('Sorry — could not send. ' + (err && err.message ? err.message : ''));
      }
    });

    document.getElementById('editBtn').addEventListener('click', () => {
      document.getElementById('thanks').classList.remove('show');
      document.getElementById('form').classList.remove('hide');
      submitBtn.disabled = false; submitBtn.textContent = Q.copy.submit;
      refreshSubmit();
      window.scrollTo(0, 0);
    });
  }
</script>
</body>
</html>
