<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Feedback</title>
<script>try{var t=localStorage.getItem('feedback-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .ff-sub{color:var(--ink-soft,#a9b4c4);margin:4px 0 18px;font-size:15px}
  .ff-cards{display:grid;gap:12px}
  .ff-card{display:block;text-decoration:none;color:inherit;background:var(--steel-2,#151b25);border:1px solid var(--line,rgba(255,255,255,.1));border-radius:18px;padding:16px 18px;position:relative;overflow:hidden}
  .ff-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .ff-card .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:var(--mist,#828e9f)}
  .ff-card .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .ff-card h3{margin:6px 0 4px;font-size:24px;color:var(--ink,#eef2f8)}
  .ff-card p{margin:0 0 10px;font-size:14px;color:var(--ink-soft,#a9b4c4)}
  .ff-card .prog{font-size:13px;font-weight:700;color:var(--c)}
  .ff-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px}
  .ff-nav a{color:var(--ink-soft,#a9b4c4);text-decoration:none}
  .ff-chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--c);color:#fff;font-size:12px;font-weight:700}
  .ff-dots{display:flex;gap:6px;margin:0 0 14px}
  .ff-dots i{flex:1;height:5px;border-radius:3px;background:var(--line,rgba(255,255,255,.12))}
  .ff-dots i.on{background:var(--c)}
  .ff-shot{width:100%;border-radius:14px;border:1px solid var(--line,rgba(255,255,255,.1));margin:4px 0 14px;display:block;cursor:zoom-in}
  .ff-title{margin:0 0 6px}
  .ff-lead{margin:0 0 16px;color:var(--ink-soft,#a9b4c4)}
  .ff-actions{display:flex;gap:10px;margin-top:16px;align-items:center}
  .ff-actions .btn-submit{flex:1}
  .ff-ghost{background:none;border:1px solid var(--line,rgba(255,255,255,.18));color:var(--ink-soft,#a9b4c4);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer}
  .ff-done{text-align:center;padding:30px 6px}
  .ff-done h2{margin:0 0 6px}
  .ff-done .row{display:grid;gap:10px;margin-top:18px}
  .ff-done a{display:block;text-decoration:none;text-align:center}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="preview-banner" id="previewBanner">
  ⚠️ Local preview mode — answers are saved only in this browser (Firebase not configured yet).
</div>

<div class="wrap" id="app"></div>

<script type="module">
  import cfg from "./js/config.js";
  import { ITEMS, CATEGORIES, stripPrefix } from "./js/items.js";
  import { saveResponse, getMyResponse, isConfigured } from "./js/db.js";
  import { initChrome } from "./js/theme.js";

  initChrome({ home: "feedback.html" });
  if (!isConfigured) document.getElementById('previewBanner').classList.add('show');

  const Q = cfg.questions, S = Q.scales[0], MAX = Q.scaleMax;
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const catKeys = Object.keys(CATEGORIES);
  const itemsOf = (cat) => ITEMS.filter(i => i.category === cat);
  const scored = {};   // itemId -> value already given by this phone

  // Load what this phone already answered, then draw.
  Promise.all(ITEMS.map(i => getMyResponse(i.id).then(r => { if (r && r.value) scored[i.id] = r.value; }).catch(() => {})))
    .then(route);
  window.addEventListener('hashchange', route);
  route();

  function setAccent(cat) {
    const c = CATEGORIES[cat] || {};
    const root = document.documentElement.style;
    root.setProperty('--acc', c.solid || '#3b82f6');
    root.setProperty('--acc-grad', c.grad || c.solid || '#3b82f6');
  }

  function route() {
    const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    window.scrollTo(0, 0);
    if (h.startsWith('done-') && CATEGORIES[h.slice(5)]) return viewDone(h.slice(5));
    const it = ITEMS.find(i => i.id.toUpperCase() === h.toUpperCase());
    if (it) return viewItem(it);
    viewHome();
  }

  // ---------- 1. Home: the chapters ----------
  function viewHome() {
    setAccent(catKeys[0]);
    app.innerHTML = `
      <h2>${esc(Q.copy.pickerTitle)}</h2>
      <p class="ff-sub">${esc(Q.copy.pickerSub)}</p>
      <div class="ff-cards">` + catKeys.map((k, n) => {
        const c = CATEGORIES[k], list = itemsOf(k);
        const done = list.filter(i => scored[i.id]).length;
        const first = list.find(i => !scored[i.id]) || list[0];
        return `<a class="ff-card" style="--c:${c.solid}" href="#${esc(first.id)}">
          <div class="top"><span>0${n + 1}</span><span class="dot"></span></div>
          <h3>${esc(c.label)}</h3>
          <p>${esc(c.blurb || '')}</p>
          <div class="prog">${done} of ${list.length} scored${done === list.length ? ' ✓' : ''}</div>
        </a>`;
      }).join('') + `</div>`;
  }

  // ---------- 2. One use case ----------
  function viewItem(it) {
    const cat = it.category, c = CATEGORIES[cat], list = itemsOf(cat);
    const idx = list.indexOf(it), last = idx === list.length - 1;
    setAccent(cat);
    document.title = `${it.title} · ${cfg.brand.titleSuffix}`;
    let value = scored[it.id] || null;

    app.innerHTML = `
      <div class="ff-nav" style="--c:${c.solid}">
        <a href="#">‹ Chapters</a>
        <span><span class="ff-chip">${esc(c.label)}</span> &nbsp;${idx + 1} / ${list.length}</span>
      </div>
      <div class="ff-dots" style="--c:${c.solid}">${list.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>
      ${it.image ? `<img class="ff-shot" id="shot" src="${esc(it.image)}" alt="${esc(it.title)}" />` : ''}
      <h1 class="ff-title">${esc(it.title)}</h1>
      <p class="ff-lead">${esc(it.lead || '')}</p>
      <div class="section">
        <div class="q">${esc(S.label)} <span class="req">*</span></div>
        ${S.hint ? `<div class="hint">${S.hint}</div>` : ''}
        <div class="scale" id="scale" role="radiogroup" aria-label="${esc(S.label)}">
          ${Array.from({ length: MAX }, (_, i) => `<button type="button" value="${i + 1}">${i + 1}</button>`).join('')}
        </div>
        ${S.ends ? `<div class="scale-ends"><span>${esc(S.ends[0])}</span><span>${esc(S.ends[1])}</span></div>` : ''}
      </div>
      <div class="ff-actions">
        ${idx > 0 ? `<button type="button" class="ff-ghost" id="prev">‹ Back</button>` : ''}
        <button type="button" class="btn-submit" id="next" disabled>${last ? 'Finish chapter' : 'Next ›'}</button>
      </div>
      <div class="ff-actions" style="justify-content:center;margin-top:8px">
        <a href="#${last ? 'done-' + cat : esc(list[idx + 1].id)}" style="color:var(--mist,#828e9f);font-size:13px">Skip this one</a>
      </div>
      <div class="note" style="margin-top:14px;text-align:center"><span class="anon">${Q.copy.anonNote}</span> ${Q.copy.anonTail}</div>`;

    const shot = document.getElementById('shot');
    if (shot) {
      shot.onerror = () => { shot.style.display = 'none'; };
      shot.onclick = () => window.open(it.image, '_blank');
    }

    const nextBtn = document.getElementById('next');
    const scale = document.getElementById('scale');
    function pick(v) {
      value = v;
      scale.querySelectorAll('button').forEach(b => b.classList.toggle('sel', Number(b.value) === v));
      nextBtn.disabled = false;
    }
    scale.querySelectorAll('button').forEach(b => b.addEventListener('click', () => pick(Number(b.value))));
    if (value) pick(value);

    const prev = document.getElementById('prev');
    if (prev) prev.onclick = () => { location.hash = list[idx - 1].id; };

    nextBtn.onclick = async () => {
      if (!value) return;
      nextBtn.disabled = true; nextBtn.textContent = Q.copy.sending;
      try {
        await saveResponse(it.id, { value });
        scored[it.id] = value;
        location.hash = last ? 'done-' + cat : list[idx + 1].id;
      } catch (err) {
        nextBtn.disabled = false; nextBtn.textContent = last ? 'Finish chapter' : 'Next ›';
        alert('Sorry — could not send. ' + (err && err.message ? err.message : ''));
      }
    };
  }

  // ---------- 3. Chapter finished ----------
  function viewDone(cat) {
    const c = CATEGORIES[cat], list = itemsOf(cat);
    const done = list.filter(i => scored[i.id]).length;
    const nextCat = catKeys.find(k => k !== cat && itemsOf(k).some(i => !scored[i.id]));
    setAccent(cat);
    app.innerHTML = `
      <div class="ff-done" style="--c:${c.solid}">
        <h2>${esc(c.label)} — done</h2>
        <p class="ff-sub">${done} of ${list.length} use cases scored. ${esc(Q.copy.thanksLive)}</p>
        <div class="row">
          ${nextCat ? `<a class="btn-submit" style="background:${CATEGORIES[nextCat].solid}" href="#${esc(itemsOf(nextCat).find(i => !scored[i.id]).id)}">Next chapter: ${esc(CATEGORIES[nextCat].label)} ›</a>` : ''}
          <a class="ff-ghost" href="#">Back to all chapters</a>
          <a class="ff-ghost" href="#${esc(list[0].id)}">Review ${esc(c.label)} answers</a>
        </div>
      </div>`;
  }
</script>
</body>
</html>
